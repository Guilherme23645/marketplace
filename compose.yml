services:
  registration-database:
    image: postgres:15
    environment:
      POSTGRES_DB: registration
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    expose:
      - "5432"
    volumes:
      - registration_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  registration_data:
